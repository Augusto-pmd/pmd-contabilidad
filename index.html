const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(pwGuardada){
  try{
    const pw=pwGuardada||document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT));
    const html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('pmd.k',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){if(pwGuardada){try{sessionStorage.removeItem('pmd.k');}catch(x){}}else document.getElementById('err').style.display='block';}
}
document.getElementById('btn').addEventListener('click',()=>go());
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
(()=>{let k=null;try{k=sessionStorage.getItem('pmd.k');}catch(e){}if(k)go(k);})();
</script></body></html>
